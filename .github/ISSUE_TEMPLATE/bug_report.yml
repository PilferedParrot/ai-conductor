name: Bug report
description: Report a reproducible problem in PilferedParrot, including the Windows preview.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, access tokens, file contents, prompts, chat transcripts, and other private data before posting.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include OS, architecture, desktop/session details, and whether this is the portable Windows preview.
      placeholder: Linux Mint 22, Cinnamon, X11; or Windows 11 x64, portable ZIP
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Name the provider, CLI or compatible endpoint, and model if relevant.
      placeholder: Claude Code, Antigravity, LM Studio, or another provider
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PilferedParrot version
      description: Include the release tag or commit and relevant CLI/browser versions.
      placeholder: v0.6.0; Chrome/Edge version; provider CLI version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Keep the steps concise and use placeholders for private paths or data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Choose ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional logs or error text. Remove keys, tokens, prompts, chat data, private paths, and project contents.
      render: text
