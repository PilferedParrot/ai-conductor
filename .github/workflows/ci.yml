name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q pilferedparrot tests

      - name: Verify release hygiene
        run: |
          python -m json.tool config.example.json >/dev/null
          sh -n bin/pilferedparrot-gui
          sh -n bin/pilferedparrot-app-browser
          sh -n bin/install-pilferedparrot-desktop
          ./bin/pilferedparrot --help >/dev/null
          if git ls-files | grep -E '(^|/)(__pycache__/|[^/]+\.py[co]$)'; then
            echo "Generated Python artifacts are tracked" >&2
            exit 1
          fi
          if git grep -n -I -E '/home/[^/]+/|/Users/[^/]+/|@yahoo\.com' -- . ':!.github/workflows/ci.yml'; then
            echo "Machine-specific path or personal email is tracked" >&2
            exit 1
          fi

  browser-tests:
    name: Playwright (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PILFEREDPARROT_REQUIRE_PLAYWRIGHT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: python -m pip install -r requirements-browser.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: python -m unittest discover -s tests -p 'test_*browser*.py' -v
