name: Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-browser.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows focused checks
        shell: pwsh
        run: |
          python -m compileall -q pilferedparrot tests/test_windows_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_windows*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_process_cleanup -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pilferedparrot.windows --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c .\PilferedParrot.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable package
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test executable
        shell: pwsh
        run: |
          $SmokeDirectory = Join-Path $env:RUNNER_TEMP "Pilfered Parrot extracted"
          Expand-Archive ./dist/PilferedParrot-0.6.0-windows-x64.zip -DestinationPath $SmokeDirectory
          $Executable = Join-Path $SmokeDirectory "PilferedParrot.exe"
          & $Executable --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Executable --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run production browser checks
        shell: pwsh
        env:
          PILFEREDPARROT_REQUIRE_PLAYWRIGHT: "1"
        run: |
          python -m unittest discover -s tests -p 'test_*browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: PilferedParrot-0.6.0-windows-x64
          path: |
            dist/PilferedParrot-0.6.0-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
